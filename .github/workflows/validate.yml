# Every push: types, unit tests, lesson validation (BUILD_PLAN.md, milestone 10), browser tests, build.
# Pushes to main that pass all of it are published to GitHub Pages, so Sean can study on his phone.
name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # uv runs real pytest under CPython, the validator's second opinion on every exercise.
      - uses: astral-sh/setup-uv@v7

      # Pyodide packages (pydantic, httpx, ...) the validator downloads for exercises.
      - uses: actions/cache@v6
        with:
          path: .cache/pyodide-packages
          key: pyodide-packages-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - run: npm run build

      # GitHub Pages serves the site from /backpy-dev/, so main gets a second build for that path.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build:pages
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
